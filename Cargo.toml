[package]
name = "linger"
version = "0.0.3"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
bincode = "2.0.1"
colored = "3.0.0"
dirs = "6.0.0"
fjall = "3"
serde = { version = "1", features = ["derive"] }
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
